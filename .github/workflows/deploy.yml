# Publica el sitio en GitHub Pages cada vez que se actualiza la rama main.
# Si el paso "Configurar GitHub Pages" fallara por permisos: Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Activa Pages (fuente: GitHub Actions) si todavía no está activado en el repositorio.
          enablement: true

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el sitio
        run: npm run build
        env:
          # En aarcardini.github.io/arar.uy el prefijo es "/arar.uy"; con dominio propio queda vacío.
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}

      - name: Subir el sitio generado
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
